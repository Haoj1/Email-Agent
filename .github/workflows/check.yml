name: Verify Email Agent

on:
  pull_request:
  push:
    branches: [imap-integrate]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: 'true'

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: email_test
          POSTGRES_PASSWORD: workflow-test-only
          POSTGRES_DB: email_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_test -d email_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://email_test:workflow-test-only@127.0.0.1:5432/email_test
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migrations and email workflows
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Verify activation and rollback
        run: bash scripts/check-release.sh
